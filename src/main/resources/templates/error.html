<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Erro</title>

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Inter Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- Script -->

        <script type="module" th:src="@{/js/modelLogin3d.js}"></script>

        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
    </head>
    <body>
        <main>
            <div id="model-3d"></div>

            <div class="interaction-wrapper">
                <div class="interaction">
                    <img
                        th:src="@{/images/pucminas-logo.png}"
                        alt="Logo PUC Minas"
                        class="interaction-icon"
                    />

                    <h1 class="interaction-title">Erro</h1>

                    <div class="interaction-message error">
                        <strong th:if="${erro != null}" th:text="${erro}">
                            Ocorreu um erro.
                        </strong>

                        <span th:if="${erro == null}">
                            Ocorreu um erro durante a operação.
                        </span>
                    </div>

                    <p class="interaction-options">
                        <a th:href="@{/login}">Voltar para o login</a>

                        <span>|</span>

                        <a th:href="@{/recoverpassword}">Recuperar senha</a>
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
