<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Criar conta</title>

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Inter Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
    </head>
    <body>
        <main>
            <div id="model-3d"></div>

            <div class="interaction-wrapper">
                <div class="interaction">
                    <img
                        th:src="@{/images/pucminas-logo.png}"
                        alt="Logo PUC Minas"
                        class="interaction-icon"
                    />

                    <h1 class="interaction-title">Criar conta</h1>

                    <div
                        class="interaction-message error"
                        th:if="${param.erro != null}"
                    >
                        <strong>Usuário já cadastrado!</strong>
                        <span> Este e-mail já possui uma conta. </span>
                    </div>

                    <div
                        class="interaction-message"
                        th:if="${param.sucesso != null}"
                    >
                        <strong>Cadastro realizado com sucesso!</strong>
                        <span>
                            Sua conta foi criada. Agora você pode fazer login.
                        </span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="input-wrapper">
                            <input
                                type="text"
                                name="nome"
                                placeholder="Nome de usuário"
                                autocomplete="name"
                                required
                            />
                        </div>

                        <div class="input-wrapper">
                            <input
                                type="email"
                                name="email"
                                placeholder="E-mail"
                                autocomplete="email"
                                required
                            />
                        </div>

                        <div class="input-wrapper">
                            <input
                                type="password"
                                name="senha"
                                placeholder="Senha"
                                autocomplete="new-password"
                                required
                            />
                        </div>

                        <button type="submit">Registrar</button>
                    </form>

                    <p class="interaction-options">
                        Já possui conta?

                        <br />

                        <a th:href="@{/login}">Faça login</a>
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
