<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recuperar senha</title>

        <!-- Font Awesome -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
            integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />

        <!-- Inter Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <!-- Script -->

        <script type="module" th:src="@{/js/modelLogin3d.js}"></script>

        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/css/styles.css}" />
    </head>
    <body>
        <main>
            <div id="model-3d"></div>

            <div class="interaction-wrapper">
                <div class="interaction">
                    <img
                        th:src="@{/images/pucminas-logo.png}"
                        alt="Logo PUC Minas"
                        class="interaction-icon"
                    />

                    <h1 class="interaction-title">Recuperar senha</h1>

                    <div
                        th:if="${param.erro}"
                        class="interaction-message error"
                    >
                        <strong> E-mail não encontrado! </strong>

                        <span> O e-mail informado não está cadastrado. </span>
                    </div>

                    <div th:if="${param.sucesso}" class="interaction-message">
                        <strong> Link enviado com sucesso! </strong>

                        <span>
                            Verifique seu e-mail para continuar a recuperação da
                            senha.
                        </span>
                    </div>

                    <form th:action="@{/recoverpassword}" method="post">
                        <div class="input-wrapper">
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="E-mail"
                                autocomplete="email"
                                required
                            />
                        </div>

                        <button type="submit">Enviar e-mail</button>
                    </form>

                    <p class="interaction-options">
                        Lembrou sua senha?

                        <br />

                        <a th:href="@{/login}">Faça login</a>
                    </p>
                </div>
            </div>
        </main>
    </body>
</html>
